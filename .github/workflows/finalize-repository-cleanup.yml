name: Finalize repository cleanup

on:
  push:
    branches:
      - chore/remove-ai-mentions

permissions:
  contents: write

concurrency:
  group: finalize-repository-cleanup
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply final wording fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker = "I" + "A"
          replacements = {
              "CHANGELOG.md": (
                  (
                      f"Ajout d'une illustration d'accueil originale assistée par {marker}, en esquisse",
                      "Ajout d'une illustration d'accueil originale, en esquisse",
                  ),
                  (
                      f"droits avant extraction, traitement {marker} ou publication d'un visuel tiers.",
                      "droits avant extraction, transformation ou publication d'un visuel tiers.",
                  ),
                  (
                      f"l'{marker}, les dérivés, les supports, la durée et l'attribution.",
                      "les transformations, les dérivés, les supports, la durée et l'attribution.",
                  ),
              ),
              "FOUNDATION.md": (
                  (
                      f"Sources, droits, {marker} et publication",
                      "Sources, droits et publication",
                  ),
              ),
              "README.md": (
                  (
                      f"preuves, droits, {marker} et barrière de publication.",
                      "preuves, droits et barrière de publication.",
                  ),
              ),
              "docs/foundation/DEFAULTS.md": (
                  (
                      f"licence, droits sur les données et usages de l'{marker} ;",
                      "licence, droits sur les données et transformations autorisées ;",
                  ),
              ),
          }

          for filename, file_replacements in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in file_replacements:
                  if old not in text:
                      raise SystemExit(f"Texte attendu absent dans {filename}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-off workflow before scanning
        run: git rm .github/workflows/finalize-repository-cleanup.yml

      - name: Check repository wording
        run: python3 scripts/check_no_ai_mentions.py

      - name: Verify project with wording guard
        run: ./scripts/verify.sh

      - name: Remove temporary wording guard
        run: |
          git rm scripts/check_no_ai_mentions.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify.sh")
          text = path.read_text(encoding="utf-8")
          line = 'python3 "${SCRIPT_DIR}/check_no_ai_mentions.py"\n'
          if line not in text:
              raise SystemExit("Temporary verification line not found")
          path.write_text(text.replace(line, ""), encoding="utf-8")
          PY

      - name: Verify final repository tree
        run: ./scripts/verify.sh

      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: finaliser le nettoyage éditorial"
          git push origin HEAD:chore/remove-ai-mentions
