name: One-off repository cleanup

on:
  push:
    branches:
      - chore/remove-ai-mentions

permissions:
  contents: write

concurrency:
  group: one-off-repository-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply repository cleanup
        run: python3 scripts/one_off_repository_cleanup.py

      - name: Refresh documentation catalog
        run: python3 scripts/documentation_catalog.py --write

      - name: Commit result
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: nettoyer les traces de production"
          git push origin HEAD:chore/remove-ai-mentions
